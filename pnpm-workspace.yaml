allowBuilds:
  esbuild: true
  core-js: true
  core-js-pure: true
minimumReleaseAgeExclude:
  - matsci-parse
  - mc-react-library
  - mc-periodic-table@0.0.3
  - mc-periodic-table@0.0.4
# matsci-parse imports moyo-wasm, which vite.config excludes from pre-bundling.
# Vite resolves that import from the app root, so link it there too.
publicHoistPattern:
  - "@spglib/moyo-wasm"
